<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5f8b'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Georgia'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="brand-mark">S</span><span class="brand-text">Study Hub</span></a>
  <span class="course-name" id="courseName"></span>
  <nav class="topnav">
    <a href="#/" data-nav="home">Course map</a>
    <a href="#/decoder" data-nav="decoder">Jargon decoder</a>
    <button class="btn btn-accent" id="askOpen" type="button">Ask<span class="wide"> a question</span></button>
  </nav>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main" tabindex="-1"></main>
</div>

<button id="selAsk" class="sel-ask" type="button" hidden>Ask about this</button>

<aside class="ask" id="ask" aria-label="Ask a question" hidden>
  <div class="ask-head">
    <strong>Ask a question</strong>
    <button class="icon-btn" id="askClose" type="button" aria-label="Close">×</button>
  </div>
  <div class="ask-context" id="askContext"></div>
  <div class="ask-log" id="askLog"></div>
  <div class="ask-quick" id="askQuick"></div>
  <form class="ask-form" id="askForm">
    <textarea id="askInput" rows="3" placeholder="Type your question… e.g. “why do we take the log?”"></textarea>
    <div class="ask-actions">
      <button class="btn btn-accent" type="submit" id="askSend">Ask</button>
      <button class="btn" type="button" id="askClaude">Open in Claude ↗</button>
    </div>
  </form>
  <details class="ask-settings" id="askSettings">
    <summary>Answer settings</summary>
    <p class="muted small">Without a key, your question opens in Claude in a new tab with the lesson context already filled in. To get answers right here instead, paste an Anthropic API key. It is saved only in this browser.</p>
    <label class="small">API key <input id="setKey" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
    <label class="small">Model <input id="setModel" type="text" placeholder="claude-haiku-5-5"></label>
    <div class="ask-actions"><button class="btn" type="button" id="setSave">Save</button><button class="btn" type="button" id="setClear">Remove key</button></div>
  </details>
</aside>

<script src="vendor/katex/katex.min.js"></script>
<script src="content/stat5701/course.js"></script>
<script src="content/stat5701/10-special-distributions.js"></script>
<script src="content/stat5701/11-continuous-distributions.js"></script>
<script src="content/stat5701/12-expectation-2.js"></script>
<script src="content/stat5701/13-simulation.js"></script>
<script src="content/stat5701/14-lln-clt.js"></script>
<script src="content/stat5701/15-mle.js"></script>
<script src="assets/widgets.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
